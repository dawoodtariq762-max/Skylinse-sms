<!DOCTYPE html>
<html lang="en" class="ams-light">
<head><script src="/assets/skyline-storage.js?v=skyline-20261026-fullrebrand-final"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/assets/skyline-favicon.png?v=skyline-20261009"  data-brand-favicon />
<title>Skyline SMS — Management Login</title>
<style>*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;font-family:Inter,Segoe UI,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:18px;}
.card{width:min(430px,100%);border:1px solid #cfd2d8;border-radius:24px;padding:30px;}
.logo{width:88px;height:88px;margin:0 auto 18px;border-radius:22px;overflow:hidden;border:1px solid #cfd2d8;}
.logo img{width:100%;height:100%;object-fit:cover;}
.eyebrow{text-align:center;text-transform:uppercase;font-size:12px;font-weight:900;letter-spacing:.16em;}
.title{text-align:center;font-size:30px;font-weight:900;margin:8px 0 4px;}
.sub{text-align:center;font-size:14px;margin-bottom:24px;}
.field{margin-bottom:15px;}
.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px;}
input{width:100%;height:50px;border:1px solid #cfd2d8;border-radius:14px;padding:0 14px;font-size:15px;outline:none;}
button{width:100%;height:52px;border:0;border-radius:15px;font-weight:950;font-size:15px;cursor:pointer;margin-top:6px;}
.msg{display:none;margin-top:14px;border-radius:12px;padding:10px;font-size:13px;}
.msg.show{display:block;}
.msg.error{border:1px solid #cfd2d8;}
.msg.success{border:1px solid #cfd2d8;}
.hint{text-align:center;margin-top:16px;font-size:12px;}
@media(max-width:520px){body{align-items:flex-start;padding:12px;}
.card{border-radius:20px;padding:24px 20px;}
.logo{display:none;}
.title{font-size:28px;}}</style>

<link rel="stylesheet" href="/assets/skyline.css?v=skyline-20261026-fullrebrand-final"/><script src="/assets/skyline.js?v=skyline-20261026-fullrebrand-final" defer></script><link rel="stylesheet" href="/assets/skyline-login-anim.css?v=skyline-20261026-fullrebrand-final"/><script>try{var _amsAnim=localStorage.getItem('ams_login_anim');document.documentElement.classList.add((_amsAnim==='on'||(_amsAnim!=='off'&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)))?'ams-anim-on':'ams-anim-off');}catch(e){}</script><script src="/branding/runtime.js"></script><script src="/assets/skyline-login-anim.js?v=skyline-20261026-fullrebrand-final" defer></script>
<link rel="stylesheet" href="/branding/runtime.css"/><link rel="stylesheet" href="/assets/skyline-login.css?v=skyline-20261026-fullrebrand-final"/></head>
<body class="ams-light ams-portal-login">
<div class="card">
  <div class="logo"><img data-brand-logo src="/assets/skyline-logo-trim.png?v=skyline-20261023" alt="Skyline SMS"></div>
  <div class="eyebrow">Admin Credentials</div>
  <div class="title">Management Panel</div>
  <div class="sub">Maintenance, imports, integrations, rates and system master tools.</div>
  <form id="form">
    <div class="field"><label>Admin Username</label><input id="username" autocomplete="username" placeholder="Admin Username" required></div>
    <div class="field"><label>Admin Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Admin Password" required></div>
    <button type="submit">Sign In</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="hint">Uses Admin account. This panel is separate from daily Admin operations.</div>
</div>
<script>
function msg(t,c){const m=document.getElementById('msg');m.textContent=t;m.className='msg show '+c;}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();msg('Checking...','success');try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Login failed');if(data.user.role!=='admin')throw new Error('Management Panel requires Admin account.');sessionStorage.setItem('ams_token',data.token);sessionStorage.setItem('ams_role',data.user.role);sessionStorage.setItem('ams_user',data.user.username);sessionStorage.setItem('ams_name',data.user.name||data.user.username);localStorage.setItem('ams_token',data.token);localStorage.setItem('ams_role',data.user.role);localStorage.setItem('ams_user',data.user.username);localStorage.setItem('ams_name',data.user.name||data.user.username);localStorage.setItem('ams_last_page_management','rates');sessionStorage.setItem('ams_fresh_login','1');location.href='/management';}catch(err){msg('❌ '+err.message,'error');}});
</script>
</body>
</html>
