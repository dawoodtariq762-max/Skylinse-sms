<link rel="stylesheet" href="/branding/runtime.css"/><link rel="stylesheet" href="/assets/skyline-login.css?v=skyline-20261026-fullrebrand-final"/></head><body class="ams-light ams-portal-login"><div class="card"><div class="logo"><img data-brand-logo alt="Skyline SMS" src="/assets/skyline-logo-trim.png?v=skyline-20261023"></div><h1>Payment Panel</h1><div class="sub">Admin only — isolated payment management</div><form id="form"><label>Username</label><input id="username" autocomplete="username" placeholder="Username"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button>Login</button><div id="msg" class="msg"></div></form></div><script>function msg(t,c){const m=document.getElementById('msg');m.className='msg '+(c||'');m.textContent=t}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();msg('Checking...','ok');try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Login failed');if(data.user.role!=='admin')throw new Error('Payment Panel requires Admin account.');sessionStorage.setItem('ams_token',data.token);sessionStorage.setItem('ams_role',data.user.role);sessionStorage.setItem('ams_user',data.user.username);sessionStorage.setItem('ams_name',data.user.name||data.user.username);localStorage.setItem('ams_token',data.token);localStorage.setItem('ams_role',data.user.role);localStorage.setItem('ams_user',data.user.username);localStorage.setItem('ams_name',data.user.name||data.user.username);localStorage.setItem('ams_last_page_payment','dashboard');sessionStorage.setItem('ams_fresh_login','1');location.href='/payment';}catch(err){msg('❌ '+err.message,'err')}});</script></body></html>
