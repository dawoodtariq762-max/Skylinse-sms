<script>
/* Auth guard — chat is for Admin / Manager / Agent only (spec 3A).
   Opening this URL directly without a valid session bounces to the login. */
(function(){
  var allowed = { admin:1, manager:1, agent:1 };
  try{
    var token = sessionStorage.getItem('ams_token') || localStorage.getItem('ams_token');
    var role  = sessionStorage.getItem('ams_role')  || localStorage.getItem('ams_role');
    if(!token || !allowed[role]){ location.replace('/panel-login'); return; }
    fetch('/api/me',{ headers:{ Authorization:'Bearer '+token } })
      .then(function(r){ if(!r.ok) throw new Error('auth'); return r.json(); })
      .then(function(u){
        if(!u || !allowed[u.role]) throw new Error('role');
        document.documentElement.style.visibility='visible';
        window.__CHAT_BOOT = { token: token, role: u.role, me: u };
        if (window.__chatStart) window.__chatStart();
      })
      .catch(function(){
        sessionStorage.clear();
        ['ams_token','ams_role','ams_user','ams_name'].forEach(function(k){ localStorage.removeItem(k); });
        location.replace('/panel-login');
      });
  }catch(e){ location.replace('/panel-login'); }
})();
</script>
<script>
/* Theme + motion pre-apply. Runs before first paint so a Dark user never sees a
   light flash. It writes nothing: the preference is still owned by AMSCore.theme
   (assets/ams.js, localStorage 'ams_theme'), which applies the same classes
   again once it loads. 'ds-lite' mirrors the shared "animations off" setting
   (localStorage 'ams_ds_anim') and Save-Data; reduced-motion is handled in CSS. */
(function(){
  try{
    var h = document.documentElement, dark = localStorage.getItem('ams_theme') === 'dark';
    h.classList.toggle('ams-dark', dark); h.classList.toggle('ams-light', !dark);
    var m = document.getElementById('metaTheme'); if(m) m.setAttribute('content', dark ? '#101a2e' : '#ffffff');
    var pref = localStorage.getItem('ams_ds_anim'), sd = navigator.connection && navigator.connection.saveData;
    if(pref === 'off' || (pref !== 'on' && sd)) h.classList.add('ds-lite');
  }catch(e){}
})();
</script>

/* ---------------- api ---------------- */
function api(path, opts){
  opts = opts || {};
  opts.headers = opts.headers || {};
  opts.headers.Authorization = 'Bearer ' + TOKEN;
  if (opts.body && !(opts.body instanceof FormData)) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  return fetch(path, opts).then(function(r){
    return r.json().catch(function(){ return null; }).then(function(j){
      if(!r.ok) { var e = new Error((j && j.error) || ('HTTP ' + r.status)); e.status = r.status; throw e; }
      return j;
    });
  });
}

/* ---------------- theme ----------------
 * Delegates to AMSCore.theme (assets/ams.js) — the same helper the Admin / Manager /
 * Agent panels use: one source of truth, same storage key ('ams_theme'), classes
 * applied to both <html> and <body>, and the same ams:theme event. The panels'
 * theme behaviour is untouched. */
function initTheme(){
  var KEY = 'ams_theme';
  function current(){
    try { return localStorage.getItem(KEY) === 'dark' ? 'dark' : 'light'; } catch(e){ return 'light'; }
  }
  function fallbackApply(mode){
    var dark = (mode || current()) === 'dark';
    var html = document.documentElement, body = document.body;
    if(html){ html.classList.toggle('ams-dark', dark); html.classList.toggle('ams-light', !dark); }
    if(body){ body.classList.toggle('ams-dark', dark); body.classList.toggle('ams-light', !dark); }
    return dark ? 'dark' : 'light';
  }
  function apply(mode){
    if(window.AMSCore && AMSCore.theme && typeof AMSCore.theme.apply === 'function') return AMSCore.theme.apply(mode);
    try { localStorage.setItem(KEY, mode); } catch(e){}
    return fallbackApply(mode);
  }
  function icon(mode){
    var b = $('btnTheme');
    if(b){
      var label = mode === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
      b.title = label; b.setAttribute('aria-label', label);
      b.setAttribute('aria-pressed', mode === 'dark' ? 'true' : 'false');
    }
    var m = $('metaTheme'); if(m) m.setAttribute('content', mode === 'dark' ? '#101a2e' : '#ffffff');
  }
  var themeT = null;
  function smooth(){
    if(reduced()) return;
    var h = document.documentElement; h.classList.add('ch-theming');
    clearTimeout(themeT); themeT = setTimeout(function(){ h.classList.remove('ch-theming'); }, 340);
  }

  var mode = apply(current());
  icon(mode);

  $('btnTheme').onclick = function(){
    var next = current() === 'dark' ? 'light' : 'dark';
    smooth();
    mode = apply(next);
    icon(mode);
  };

  /* Stay in step if the theme is changed elsewhere (e.g. another tab). */
  document.addEventListener('ams:theme', function(e){
    var m = (e && e.detail && e.detail.theme) || current();
    icon(m);
  });
  window.addEventListener('storage', function(e){
    if(e.key === KEY){ var m = current(); smooth(); apply(m); icon(m); }
  });
}

  { name:'Faces',          list:EMOJI.slice(0, 72) },
  { name:'Hands',          list:EMOJI.slice(72, 80) },
  { name:'Work and symbols', list:EMOJI.slice(80) }
];
/* Emoji-only messages are shown large, like a messenger. The \p{...} escape is
   built at runtime so a browser without Unicode property escapes simply skips
   the feature instead of failing to parse this whole script. */
var RE_EMO = null, RE_PIC = null;
try {
  RE_EMO = new RegExp('^[\\p{Extended_Pictographic}\\uFE0F\\u200D\\u20E3\\s]+$', 'u');
  RE_PIC = new RegExp('\\p{Extended_Pictographic}', 'gu');
} catch(e){}
function isEmojiOnly(s){
  if(!RE_EMO) return false;
  s = String(s == null ? '' : s).trim();
  if(!s || s.length > 24 || !RE_EMO.test(s)) return false;
  var n = (s.match(RE_PIC) || []).length;
  return n >= 1 && n <= 3;
}
function insertAtCursor(t, s){
  var a = t.selectionStart, b = t.selectionEnd;
  if(typeof a !== 'number'){ t.value += s; return; }
  t.value = t.value.slice(0, a) + s + t.value.slice(b);
  t.selectionStart = t.selectionEnd = a + s.length;
}
function initEmoji(){
  var p = $('emojiPanel'), btn = $('btnEmoji');
  EMOJI_GROUPS.forEach(function(g){
    var h = document.createElement('div'); h.className = 'eg'; h.textContent = g.name; p.appendChild(h);
    g.list.forEach(function(e){
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = e; b.setAttribute('aria-label', 'Insert ' + e);
      b.onclick = function(){ var t = $('input'); insertAtCursor(t, e); t.focus(); onInput(); closeEmoji(); };
      p.appendChild(b);
    });
  });
  btn.onclick = function(ev){ ev.stopPropagation(); if(p.classList.contains('open')) closeEmoji(); else openEmoji(); };
  document.addEventListener('click', function(){ closeEmoji(); });
  p.addEventListener('click', function(ev){ ev.stopPropagation(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && p.classList.contains('open')){ closeEmoji(); btn.focus(); }
  });
}
function openEmoji(){ $('emojiPanel').classList.add('open'); $('btnEmoji').setAttribute('aria-expanded', 'true'); }
function closeEmoji(){ $('emojiPanel').classList.remove('open'); $('btnEmoji').setAttribute('aria-expanded', 'false'); }

/* ---------------- formatting ---------------- */
function timeOf(iso){
  if(!iso) return '';
  var d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
}
function fullTime(iso){
  var d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleString([], {weekday:'short', day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit'});
}
function dayLabel(iso){
  var d = new Date(iso); if(isNaN(d)) return '';
  var t = new Date();
  if(d.toDateString()===t.toDateString()) return 'Today';
  var y = new Date(t.getTime()-86400000);
  if(d.toDateString()===y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], {day:'numeric', month:'short', year:'numeric'});
}
function fmtSize(n){
  n = +n || 0;
  if(n < 1024) return n + ' B';
  if(n < 1048576){ var k = n/1024; return (k < 10 ? k.toFixed(1) : Math.round(k)) + ' KB'; }
  var m = n/1048576; return (m < 10 ? m.toFixed(1) : Math.round(m)) + ' MB';
}
function attKind(name, mime){
  var s = String(name||'').toLowerCase(); mime = String(mime||'');
  if(/\.csv$/.test(s) || /csv/.test(mime)) return 'csv';
  if(/\.(mp4|webm|mov|avi|mkv)$/.test(s) || /^video\//.test(mime)) return 'video';
  return 'txt';
}
var KIND_ICON = { csv:'table', video:'video', txt:'file' }, KIND_LABEL = { csv:'CSV', video:'Video', txt:'Text' };
function firstChar(s){ var m = String(s||'').trim().match(/^[\uD800-\uDBFF][\uDC00-\uDFFF]|^[\s\S]/); return m ? m[0].toUpperCase() : '?'; }
function cap(s){ s = String(s||''); return s.charAt(0).toUpperCase() + s.slice(1); }
function badgeText(n){ return n > 99 ? '99+' : String(n); }

/* ---------------- receipts (3F) ----------------
 * Drawn strictly from the server's receipt state; the UI never guesses.
 *   sent      one grey tick    stored, recipient has no live chat session
 *   delivered two grey ticks   recipient session is online and received it
 *   read      two blue ticks   recipient opened this conversation (server-confirmed)
 * When the server upgrades a message the second tick slides in and the colour
 * washes blue — CSS does that from the class change alone. */
var RC_LABEL = { sent:'Sent', delivered:'Delivered', read:'Read' };
function rcOf(m){ return m.receipt === 'read' ? 'read' : (m.receipt === 'delivered' ? 'delivered' : 'sent'); }
function tickHTML(m){
  if(!m.mine) return '';
  var c = rcOf(m);
  return '<span class="tick '+c+'" role="img" aria-label="'+RC_LABEL[c]+'" title="'+RC_LABEL[c]+'">'
       + '<svg viewBox="0 0 18 12" aria-hidden="true"><path class="t1" d="M1.5 6.5 5 10 12.5 2"/><path class="t2" d="M5.5 6.5 9 10 16.5 2"/></svg></span>';
}
function setTick(el, c){
  el.classList.remove('sent', 'delivered', 'read'); el.classList.add(c);
  el.setAttribute('aria-label', RC_LABEL[c]); el.title = RC_LABEL[c];
}

/* ---------------- conversation list ----------------
 * The list is built from two sources:
 *   /api/chatapp/conversations  — conversations that already exist
 *   /api/chatapp/participants   — who this account is ALLOWED to talk to,
 *                                 from the real account records and hierarchy
 * Merging them means an Agent sees their Manager by name immediately,
 * before a single message has been sent, instead of an empty list. Clicking
 * an entry that has no conversation yet opens (creates) it on demand.
 *
 * Rows are patched in place when the set of rows is unchanged, so selection,
 * unread and presence changes animate instead of blinking, and a 30-second
 * resync that changes nothing touches no DOM at all. */
function convName(c){
  return (c.other && (c.other.name || c.other.username)) ? (c.other.name || c.other.username) : (c._name || 'Conversation');
}
function convRole(c){ return c.supervised ? '' : (c.other ? c.other.role : (c._role || '')); }
function rowKey(c){ return c.id != null ? 'c' + c.id : 'u' + c._user_id; }
function participantsLine(c){
  return (c.participants||[]).map(function(p){ return (p.name||p.username)+' ('+p.role+')'; }).join(' \u2194 ');
}
function rowInner(c){
  var nm = convName(c), role = convRole(c), direct = !c.supervised && c.other;
  var on = direct && presence[c.other.id] === 'online';
  var preview = c.last_message ? (c.last_message.body || '[attachment]')
              : (c._pending ? 'No messages yet \u2014 say hello' : 'No messages yet');
  return '<span class="av" data-role="'+esc(role)+'">'+esc(firstChar(nm))
       +   (direct ? '<span class="pdot'+(on?' online':'')+'"></span>' : '')+'</span>'
       + '<span class="cmeta">'
       +   '<span class="crow1"><span class="cname">'+esc(nm)+'</span>'
       +     (c.supervised ? '<span class="role plain">Supervised</span>'
                           : (role ? '<span class="role" data-role="'+esc(role)+'">'+esc(cap(role))+'</span>' : ''))
       +     '<span class="ctime">'+esc(c.id ? timeOf(c.last_message_at) : '')+'</span></span>'
       +   '<span class="crow2"><span class="cprev">'+esc(preview)+'</span>'
       +     (c.unread ? '<span class="badge" aria-label="'+c.unread+' unread">'+badgeText(c.unread)+'</span>' : '')+'</span>'
       +   (c.supervised ? '<span class="csub">'+esc(participantsLine(c))+'</span>' : '')
       + '</span>'
       + (direct ? '<span class="sr">'+(on ? 'Online' : 'Offline')+'</span>' : '');
}
function paintRow(el, c){
  var isOn = current && c.id != null && current.id === c.id;
  var cls = 'conv' + (c._pending ? ' conv-new' : '') + (c.unread ? ' unread' : '') + (isOn ? ' on' : '')
          + (el.classList.contains('pending-open') ? ' pending-open' : '');
  if(el.className !== cls) el.className = cls;
  if(isOn) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current');
  var inner = rowInner(c);
  if(el._sig !== inner){
    el.innerHTML = inner; el._sig = inner;
    if((c.unread||0) > (el._unread||0)){ var b = el.querySelector('.badge'); if(b && !reduced()) b.classList.add('pop'); }
    el._unread = c.unread || 0;
  }
}
function listStateHTML(){
  if(listState === 'loading'){
    var s = '';
    for(var i=0;i<6;i++) s += '<div class="skrow" aria-hidden="true"><div class="sk a"></div><div class="col"><div class="sk l1"></div><div class="sk l2"></div></div></div>';
    return '<div role="status" aria-label="Loading conversations">'+s+'</div>';
  }
  if(listState === 'error'){
    return '<div class="state err-state"><div class="ico-wrap">'+ico('alert')+'</div><h4>Couldn\u2019t load conversations</h4>'
         + '<p>'+esc(listError || 'Check your connection and try again.')+'</p>'
         + '<button type="button" class="btn primary" data-act="retry-list">Try again</button></div>';
  }
  return '<div class="state"><h4>No conversations yet</h4><p>When you can message someone, they will appear here.</p></div>';
}
function renderList(){
  var el = $('convList'), total = 0;
  convs.forEach(function(c){ total += c.unread || 0; });
  var ut = $('unreadTotal');
  ut.textContent = badgeText(total); ut.style.display = total ? 'inline-grid' : 'none';
  document.title = (total ? '(' + badgeText(total) + ') ' : '') + BASE_TITLE;

  if(!convs.length){ el._rows = false; el.innerHTML = listStateHTML(); return; }

  var keys = convs.map(rowKey), kids = el.children;
  var same = el._rows && kids.length === keys.length && keys.every(function(k, i){ return kids[i].getAttribute('data-key') === k; });
  if(!same){
    var focusKey = document.activeElement && document.activeElement.getAttribute && el.contains(document.activeElement)
                 ? document.activeElement.getAttribute('data-key') : null;
    var frag = document.createDocumentFragment();
    convs.forEach(function(c){
      var b = document.createElement('button');
      b.type = 'button'; b.setAttribute('data-key', rowKey(c));
      if(c.id != null) b.setAttribute('data-id', c.id);
      else { b.setAttribute('data-user', String(c._user_id)); b.setAttribute('data-new', '1'); }
      paintRow(b, c); frag.appendChild(b);
    });
    el.innerHTML = ''; el.appendChild(frag); el._rows = true;
    if(focusKey){ var f = el.querySelector('[data-key="'+focusKey+'"]'); if(f) f.focus(); }
  } else {
    convs.forEach(function(c, i){ paintRow(kids[i], c); });
  }
}

/* One delegated handler for every row. */
function onListClick(e){
  var retry = e.target.closest && e.target.closest('[data-act="retry-list"]');
  if(retry){ listState = 'loading'; renderList(); loadConvs(); return; }
  var n = e.target.closest && e.target.closest('.conv');
  if(!n) return;
  if(n.getAttribute('data-new') === '1'){
    /* No conversation row yet — create it, then open it. The server is
       the authority on whether this pairing is allowed. */
    var uid = parseInt(n.getAttribute('data-user'), 10);
    n.classList.add('pending-open');
    api('/api/chatapp/conversations/open',{method:'POST',body:{ user_id: uid }})
      .then(function(r){
        var id = r.conversation && r.conversation.id;
        /* The row is brand new, so refresh the list first — openConv()
           resolves the id out of `convs` and would otherwise find nothing. */
        return loadConvs(true).then(function(){ openConv(id); });
      })
      .catch(function(err){ n.classList.remove('pending-open'); showErr(err.message); });
    return;
  }
  openConv(parseInt(n.getAttribute('data-id'), 10));
}

/* ---------------- thread ---------------- */
var view = { key:null, mode:'none', ids:[], rc:{}, els:{}, lastDay:'', lastMsg:null };
var lastNear = true;

function nearBottom(box){ return box.scrollHeight - box.scrollTop - box.clientHeight < 140; }
function toBottom(smooth){
  var b = $('msgs');
  if(smooth && !reduced() && typeof b.scrollTo === 'function') b.scrollTo({ top:b.scrollHeight, behavior:'smooth' });
  else b.scrollTop = b.scrollHeight;
  lastNear = true;
}
function showJump(n){
  var j = $('jump'); $('jumpN').textContent = badgeText(n); j.hidden = n <= 0;
}

var GROUP_MS = 5 * 60 * 1000;
function groupKey(m){ return m.mine ? 'me' : 'u' + m.sender_id; }
function sameGroup(a, b, st){
  if(!a || !b) return false;
  if(st && st.newFromId != null && b.id === st.newFromId) return false;       /* the unread divider breaks a group */
  if(groupKey(a) !== groupKey(b)) return false;
  var ta = Date.parse(a.created_at), tb = Date.parse(b.created_at);
  if(isNaN(ta) || isNaN(tb)) return true;
  if(new Date(ta).toDateString() !== new Date(tb).toDateString()) return false;
  return Math.abs(tb - ta) <= GROUP_MS;
}
function posOf(msgs, i, st){
  var p = sameGroup(msgs[i-1], msgs[i], st), n = sameGroup(msgs[i], msgs[i+1], st);
  return !p && !n ? 'solo' : (!p && n ? 'first' : (p && n ? 'mid' : 'last'));
}

function attHTML(a){
  var k = attKind(a.name, a.mime);
  return '<button type="button" class="att-btn" data-att="'+esc(a.id)+'" data-name="'+esc(a.name||'')+'" data-state="idle"'
       +   ' aria-label="Download '+esc(a.name||'file')+'">'
       + '<span class="att-ico" data-kind="'+k+'">'+ico(KIND_ICON[k])+'</span>'
       + '<span class="att-meta"><span class="att-name">'+esc(a.name)+'</span>'
       +   '<span class="att-sub">'+KIND_LABEL[k]+(a.size ? ' \u00b7 '+fmtSize(a.size) : '')+'</span></span>'
       + '<span class="att-act" aria-hidden="true"><span class="a-idle">'+ico('download')+'</span><span class="a-load"><span class="spin"></span></span>'
       +   '<span class="a-done">'+ico('check')+'</span><span class="a-err">'+ico('alert')+'</span></span>'
       + '<span class="att-bar" aria-hidden="true"><i></i></span></button>';
}
function msgHTML(m, pos, enter){
  var hasAtt = !!(m.attachments && m.attachments.length);
  var hasTxt = !!(m.body && String(m.body).length);
  var emo = !hasAtt && isEmojiOnly(m.body);
  var inline = hasTxt && !hasAtt && !emo;
  /* A button, not an <a href>: an anchor navigation cannot carry the
     Authorization header the download route requires, so the old markup
     was refused by the server even for the intended recipient. */
  var foot = '<span class="mfoot'+(inline ? '' : ' row')+'"><time datetime="'+esc(m.created_at||'')+'" title="'+esc(fullTime(m.created_at))+'">'
           + esc(timeOf(m.created_at))+'</time>'+tickHTML(m)+'</span>';
  var who = (!m.mine && current && current.supervised && (pos === 'first' || pos === 'solo'))
          ? '<div class="who">'+esc(m.sender_name||('user#'+m.sender_id))+'</div>' : '';
  return '<div class="msg'+(m.mine?' mine':'')+(emo?' emoji-only':'')+(enter?' enter':'')+'" data-id="'+esc(m.id)+'" data-pos="'+pos+'">'
       + who
       + (hasTxt ? '<div class="txt" dir="auto">'+esc(m.body)+(inline ? foot : '')+'</div>' : '')
       + (hasAtt ? '<div class="att">'+m.attachments.map(attHTML).join('')+'</div>' : '')
       + (inline ? '' : foot)
       + '</div>';
}
function dayHTML(d){ return '<div class="day" role="separator">'+esc(d)+'</div>'; }
function newDivHTML(n){ return '<div class="newdiv" id="newDivider" role="separator"><span>'+n+' new message'+(n===1?'':'s')+'</span></div>'; }

function stateBox(html){
  var box = $('msgs'); box.innerHTML = html;
  view = { key:view.key, mode:'state', ids:[], rc:{}, els:{}, lastDay:'', lastMsg:null };
}
function skeletonHTML(){
  var s = '', side = ['','me','','me','']; 
  for(var i=0;i<side.length;i++) s += '<div class="sk skmsg '+side[i]+'" style="width:'+[58,44,70,36,52][i]+'%"></div>';
  return '<div role="status" aria-label="Loading messages" style="display:flex;flex-direction:column;flex:1">'+s+'</div>';
}

function paintHeader(){
  var c = current, nm = convName(c), role = convRole(c), o = c.other, sup = c.supervised;
  var av = $('tAvatar'); av.textContent = firstChar(nm); av.setAttribute('data-role', sup ? '' : role);
  $('tName').textContent = nm;
  var tp = $('tPresence'), ts = $('tStatus'), tr = $('tRole'), tu = $('tUser');
  if(sup || !o){
    tp.hidden = ts.hidden = tr.hidden = true;
    tu.textContent = sup ? participantsLine(c) : '';
  } else {
    var on = presence[o.id] === 'online';
    tp.hidden = ts.hidden = tr.hidden = false;
    tp.className = 'presence-dot ' + (on ? 'online' : 'offline');
    tp.title = on ? (nm + ' is online') : (nm + ' is offline');
    ts.className = 'presence-label' + (on ? ' online' : ''); ts.textContent = on ? 'Online' : 'Offline';
    tr.textContent = cap(role); tr.setAttribute('data-role', role);
    tu.textContent = o.username ? '@' + o.username : '';
  }
}

function renderThread(){
  var box = $('msgs');
  if(!current){
    box.hidden = true; $('emptyState').hidden = false; $('composer').hidden = true; $('thead').hidden = true; $('jump').hidden = true;
    view = { key:null, mode:'none', ids:[], rc:{}, els:{}, lastDay:'', lastMsg:null };
    return;
  }
  $('emptyState').hidden = true; box.hidden = false; $('composer').hidden = false; $('thead').hidden = false;
  paintHeader();
  paintMessages();
}

function paintMessages(){
  var box = $('msgs'), key = 'c' + current.id, st = ui(current.id), msgs = current._msgs;
  var switching = view.key !== key;
  if(switching){
    view = { key:key, mode:'none', ids:[], rc:{}, els:{}, lastDay:'', lastMsg:null };
    st.unseen = 0; showJump(0); lastNear = true;
    ['msgs','thead'].forEach(function(id){
      var n = $(id); if(reduced()) return;
      n.classList.remove('view-in'); void n.offsetWidth; n.classList.add('view-in');
    });
  }
  if(!msgs){
    if(st.err) stateBox('<div class="state err-state"><div class="ico-wrap">'+ico('alert')+'</div><h4>Couldn\u2019t load messages</h4><p>'+esc(st.err)+'</p>'
                      + '<button type="button" class="btn primary" data-act="retry-thread">Try again</button></div>');
    else if(view.mode !== 'state' || switching) stateBox(skeletonHTML());
    return;
  }
  if(!msgs.length){
    if(view.mode !== 'empty'){
      stateBox('<div class="state"><h4>No messages yet</h4><p>Say hello to '+esc(convName(current))+' \ud83d\udc4b</p></div>');
      view.mode = 'empty';
    }
    return;
  }
  var inc = !switching && view.mode === 'list' && view.ids.length <= msgs.length
         && view.ids.every(function(id, i){ return msgs[i].id === id; });
  if(inc){ patchReceipts(msgs); appendMessages(msgs); }
  else rebuild(msgs, switching);
}

function rebuild(msgs, switching){
  var box = $('msgs'), st = ui(current.id);
  var wasNear = nearBottom(box), fromBottom = box.scrollHeight - box.scrollTop;
  var html = '', lastDay = '';
  msgs.forEach(function(m, i){
    var d = dayLabel(m.created_at);
    if(d && d !== lastDay) html += dayHTML(d);
    if(d) lastDay = d;
    if(st.newFromId != null && m.id === st.newFromId) html += newDivHTML(st.newCount);
    html += msgHTML(m, posOf(msgs, i, st), false);
  });
  box.innerHTML = html;
  view.mode = 'list'; view.ids = msgs.map(function(m){ return m.id; }); view.rc = {}; view.els = {};
  view.lastDay = lastDay; view.lastMsg = msgs[msgs.length-1];
  Array.prototype.forEach.call(box.querySelectorAll('.msg[data-id]'), function(el, i){
    var m = msgs[i]; view.els[m.id] = el; view.rc[m.id] = rcOf(m);
  });
  if(switching || wasNear){
    toBottom(false);
    /* Land on the first unread message when there are too many to fit on screen. */
    var nd = $('newDivider');
    if(switching && nd && nd.offsetTop < box.scrollTop) box.scrollTop = Math.max(0, nd.offsetTop - 12);
  } else {
    box.scrollTop = box.scrollHeight - fromBottom;
  }
}

function patchReceipts(msgs){
  /* A bulk upgrade (the recipient opens the chat: every message turns blue at
     once) must not run the tick animation on bubbles nobody can see — that cost
     a style recalculation per frame per tick. Ticks near the viewport animate;
     the rest switch instantly. All layout reads happen before any write. */
  var box = $('msgs'), top = box.scrollTop - 60, bot = box.scrollTop + box.clientHeight + 60, todo = [];
  msgs.forEach(function(m){
    if(!m.mine) return;
    var c = rcOf(m);
    if(view.rc[m.id] === c) return;
    view.rc[m.id] = c;
    var el = view.els[m.id], t = el && el.querySelector('.tick');
    if(t) todo.push({ t:t, c:c, vis: el.offsetTop + el.offsetHeight > top && el.offsetTop < bot });
  });
  var quiet = [];
  todo.forEach(function(x){
    if(!x.vis){ x.t.classList.add('instant'); quiet.push(x.t); }
    setTick(x.t, x.c);
  });
  if(quiet.length) requestAnimationFrame(function(){ requestAnimationFrame(function(){
    quiet.forEach(function(t){ t.classList.remove('instant'); });
  }); });
}

function appendMessages(msgs){
  var from = view.ids.length;
  if(from === msgs.length) return;
  var box = $('msgs'), st = ui(current.id);
  var wasNear = nearBottom(box), html = '', lastDay = view.lastDay, added = msgs.slice(from);
  added.forEach(function(m, k){
    var i = from + k, d = dayLabel(m.created_at);
    if(d && d !== lastDay) html += dayHTML(d);
    if(d) lastDay = d;
    html += msgHTML(m, posOf(msgs, i, st), true);
  });
  /* The message that used to be last may now sit in the middle of a group. */
  if(from > 0){
    var pe = view.els[msgs[from-1].id], np = posOf(msgs, from-1, st);
    if(pe && pe.getAttribute('data-pos') !== np) pe.setAttribute('data-pos', np);
  }
  box.insertAdjacentHTML('beforeend', html);
  var els = box.querySelectorAll('.msg[data-id]'), base = els.length - added.length;
  added.forEach(function(m, k){ var el = els[base + k]; view.els[m.id] = el; view.rc[m.id] = rcOf(m); });
  view.ids = msgs.map(function(m){ return m.id; }); view.lastDay = lastDay; view.lastMsg = msgs[msgs.length-1];

  var mine = added.some(function(m){ return m.mine; });
  if(wasNear || mine) toBottom(true);
  else { st.unseen += added.filter(function(m){ return !m.mine; }).length; showJump(st.unseen); }
}

function openConv(id){
  /* Participant-only rows carry id:null until a conversation exists. Opening
     one must create the conversation first — passing the null straight into
     the messages URL produced a 404 on every load. */
  if(id === null || id === undefined){ return; }
  var c = convById(id);
  if(!c){
    /* Not in the cached list yet (a conversation created moments ago).
       Refresh once, then open it. */
    loadConvs(true).then(function(){
      var again = convById(id);
      if(again) openConv(id);
    });
    return;
  }
  var st = ui(id);
  var unreadAtOpen = c.unread || 0;
  current = c; c.unread = 0;
  st.err = ''; st.newFromId = null; st.newCount = 0; st.dirty = false;
  renderList();
  $('body').classList.add('hide-list');
  renderThread();
  fetchMessages(id, unreadAtOpen);
}
function fetchMessages(id, unreadAtOpen){
  var st = ui(id);
  return api('/api/chatapp/conversations/'+id+'/messages?limit=100').then(function(r){
    var tgt = convById(id) || current;
    tgt._msgs = r.messages || [];
    /* Mark where the unread block starts: the last N messages from the other party. */
    if(unreadAtOpen){
      var inbound = tgt._msgs.filter(function(m){ return !m.mine; });
      var k = Math.min(unreadAtOpen, inbound.length);
      if(k){ st.newFromId = inbound[inbound.length-k].id; st.newCount = k; }
    }
    if(current && current.id === id){ current = tgt; renderThread(); }
    // explicit read — the ONLY thing that turns ticks blue (3F)
    return api('/api/chatapp/conversations/'+id+'/read', {method:'POST', body:{}});
  }).then(function(){
    if(st.dirty){ st.dirty = false; openConvSilent(); }
    return loadConvs(true);
  }).catch(function(e){
    st.err = e.message || 'Something went wrong.';
    if(current && current.id === id && !(current._msgs)) renderThread();
    showErr(e.message);
  });
}

/* Merge the server's authorised participants into the conversation list.
   A participant with no conversation yet is rendered from the real account
   record (name, username, role) and marked _pending, so it is visible and
   clickable before any message exists. Opening one creates the row. */
function mergeParticipants(list, parts){
  var have = {};
  list.forEach(function(c){
    (c.participants||[]).forEach(function(p){ if(p && p.id) have[p.id]=1; });
    if(c.other && c.other.id) have[c.other.id] = 1;
  });
  (parts||[]).forEach(function(p){
    if(!p || !p.user_id) return;
    if(p.has_conversation) return;           // already in the list
    if(have[p.user_id]) return;              // covered by an existing row
    list.push({
      id: null,
      _pending: true,
      _user_id: p.user_id,
      _name: p.name || p.username,
      _role: p.role,
      other: { id: p.user_id, name: p.name || p.username, username: p.username, role: p.role },
      unread: 0,
      last_message: null,
      last_message_at: null,
      supervised: false,
      participants: [],
      _msgs: [],
    });
  });
  return list;
}

/* Overlapping refreshes (a message, a read receipt and a poll can all land
   together) share one follow-up request instead of firing one each. */
var convRun = null, convNext = null;
function loadConvs(silent){
  if(!convRun){
    convRun = doLoadConvs(silent).then(function(){ convRun = null; }, function(){ convRun = null; });
    return convRun;
  }
  if(!convNext){
    convNext = convRun.then(function(){ convNext = null; return loadConvs(silent); });
  }
  return convNext;
}
function doLoadConvs(silent){
  return api('/api/chatapp/conversations').then(function(r){
    var prev = {}; convs.forEach(function(c){ prev[c.id]=c._msgs; });
    convs = r.conversations || [];
    convs.forEach(function(c){ if(prev[c.id]) c._msgs = prev[c.id]; });
    if(current){
      var f = convById(current.id);
      if(f){ f._msgs = current._msgs; current = f; }
    }
    listState = 'ready';
    /* Add the people this account is allowed to talk to but has never
       messaged. A failure here must not hide the existing conversations. */
    return api('/api/chatapp/participants').then(function(pr){
      convs = mergeParticipants(convs, pr.participants);
    }).catch(function(){ /* participants are an enhancement, not a requirement */ })
     .then(function(){ return refreshPresence(); })
     .then(function(){ renderList(); });
  }).catch(function(e){
    if(!convs.length){ listState = 'error'; listError = e.message; renderList(); }
    if(!silent) showErr(e.message);
  });
}

/* Pull the server's presence state for everyone I can talk to. This is the
   single source of truth for the online indicator and for what the ticks
   mean; the stream pushes changes, this just resynchronises. */
function refreshPresence(){
  return api('/api/chatapp/presence').then(function(r){
    presence = (r && r.presence) || {};
  }).catch(function(){ /* keep the last known state */ });
}

/* ==================================================================
 * NOTIFICATION SOUND (task 2)
 * ------------------------------------------------------------------
 * The tone is synthesised with the Web Audio API, so there is no asset
 * to ship, nothing to preload and no network request on first message.
 *
 * Rules enforced here:
 *   - Only for messages whose sender is NOT me.
 *   - Only for messages that arrive live over the stream. Messages loaded
 *     from history (initial load, openConvSilent, refresh) never sound.
 *   - Played at most once per message id, so a reconnect, a duplicate
 *     event or a re-render cannot make it fire twice.

  }
  $('lockPin').addEventListener('keydown', caps); $('lockPin').addEventListener('keyup', caps);

  /* Reveal/hide the PIN — purely a typing aid; nothing about storage changes. */
  $('lockToggle').onclick = function(){
    var i = $('lockPin'), b = $('lockToggle');
    var showing = i.type === 'text';
    i.type = showing ? 'password' : 'text';
    b.setAttribute('aria-pressed', showing ? 'false' : 'true');
    b.setAttribute('aria-label', showing ? 'Show PIN' : 'Hide PIN');
    b.title = showing ? 'Show PIN' : 'Hide PIN';
    i.focus();
  };

  /* ---- sound toggle (task 2) ------------------------------------
   * Muted state is remembered per browser. Clicking the control also
   * counts as the user gesture browsers need before they will let a page
   * play audio, so un-muting plays a confirmation tone immediately. */
  function paintSound(){
    var b = $('btnSound'); if(!b) return;
    var muted = Sound.isMuted();
    b.classList.toggle('muted', muted);
    b.querySelector('.lbl').textContent = muted ? 'Muted' : 'Sound';
    b.setAttribute('aria-pressed', muted ? 'false' : 'true');
    b.title = muted ? 'Message sound is off \u2014 click to turn on'
                    : 'Message sound is on \u2014 click to mute';
  }
  paintSound();
  $('btnSound').onclick = function(){
    Sound.setMuted(!Sound.isMuted());
    paintSound();
    if(!Sound.isMuted()) Sound.preview();   /* also unlocks audio */
  };

  /* ---- attachment downloads (task 3) ----------------------------
   * Delegated, so cards created by later re-renders work too. */
  document.addEventListener('click', function(e){
    var retry = e.target && e.target.closest ? e.target.closest('[data-act="retry-thread"]') : null;
    if(retry){ if(current){ ui(current.id).err = ''; renderThread(); fetchMessages(current.id, 0); } return; }
    var b = e.target && e.target.closest ? e.target.closest('.att-btn') : null;
    if(!b) return;
    e.preventDefault();
    var id = b.getAttribute('data-att');
    if(!id || b.getAttribute('data-state') === 'loading') return;
    setAttState(b, 'loading');
    downloadAttachment(id, b.getAttribute('data-name'), function(p){ setAttState(b, 'loading', p); }).then(function(){
      setAttState(b, 'done');
      setTimeout(function(){ setAttState(b, 'idle'); }, 1800);
    }, function(){
      setAttState(b, 'error');
      setTimeout(function(){ setAttState(b, 'idle'); }, 2800);
    });
  });

  /* ---- scrolling: unseen-message jump control ---- */
  var scrollRaf = 0;
  $('msgs').addEventListener('scroll', function(){
    if(scrollRaf) return;
    scrollRaf = requestAnimationFrame(function(){
      scrollRaf = 0;
      var near = nearBottom($('msgs')); lastNear = near;
      if(near && current){ ui(current.id).unseen = 0; showJump(0); }
    });
  }, { passive:true });
  $('jump').onclick = function(){ if(current) ui(current.id).unseen = 0; showJump(0); toBottom(true); };
  /* Drop the entry animation once it has played, so a node never replays it. */
  $('msgs').addEventListener('animationend', function(e){
    if(e.target.classList && e.target.classList.contains('enter')) e.target.classList.remove('enter');
  });
  $('msgs').addEventListener('animationend', function(e){
    if(e.target === this) this.classList.remove('view-in');
  });
  $('thead').addEventListener('animationend', function(e){ if(e.target === this) this.classList.remove('view-in'); });
  ['cbox','lockField'].forEach(function(id){
    $(id).addEventListener('animationend', function(){ this.classList.remove('shake'); });
  });
  $('btnSend').addEventListener('animationend', function(e){ if(e.target.closest) this.classList.remove('sent'); });

  /* Coming back to a tab (or waking a phone) resynchronises: a background tab
     can have missed stream events. */
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible' && listState !== 'loading'){ loadConvs(true); if(current) openConvSilent(); }
  });

  checkLock().then(function(){
    return loadConvs();
  }).then(function(){
    // open the single natural counterpart automatically, like a messenger would
    // (only a real conversation — a participant row has no id yet)
    if(convs.length === 1 && convs[0].id != null) openConv(convs[0].id);
    startStream();
    setInterval(function(){ if(document.visibilityState !== 'hidden') loadConvs(true); }, 30000);
  }).catch(function(e){ showErr(e.message); });
}

if (window.__CHAT_BOOT) start();
else window.__chatStart = start;
})();
</script>
</body>
</html>
