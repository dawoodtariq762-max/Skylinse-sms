<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="skNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="skArrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="skBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="skGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background subtle glow -->
  <circle cx="50" cy="50" r="46" fill="#080c14"/>
  <!-- Base Chevron / Foundation -->
  <path d="M50 78 L26 62 L32 58 L50 70 L68 58 L74 62 Z" fill="url(#skBase)" stroke="#38bdf8" stroke-width="0.8"/>
  <!-- Left Outer Building -->
  <polygon points="26,58 32,54 32,44 26,48" fill="#1e293b" stroke="#2563eb" stroke-width="0.7"/>
  <!-- Left Mid Building -->
  <polygon points="34,53 40,49 40,32 34,36" fill="#1e3a8a" stroke="#38bdf8" stroke-width="0.7"/>
  <!-- Center Main Tower -->
  <polygon points="44,70 50,66 50,14 44,20" fill="url(#skBlue)" stroke="#38bdf8" stroke-width="0.8"/>
  <polygon points="50,66 56,70 56,20 50,14" fill="#0f172a" stroke="#2563eb" stroke-width="0.8"/>
  <line x1="50" y1="14" x2="50" y2="7" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
  <!-- Right Mid Building -->
  <polygon points="60,53 66,49 66,35 60,39" fill="#1e3a8a" stroke="#2563eb" stroke-width="0.7"/>
  <!-- Right Outer Building -->
  <polygon points="68,58 74,54 74,45 68,49" fill="#1e293b" stroke="#38bdf8" stroke-width="0.7"/>
  <!-- Architectural vertical window slits -->
  <line x1="47" y1="28" x2="47" y2="46" stroke="#93c5fd" stroke-width="0.7" opacity="0.8"/>
  <line x1="53" y1="32" x2="53" y2="52" stroke="#60a5fa" stroke-width="0.7" opacity="0.8"/>
  <!-- Diagonal Supersonic Speed Arrow Ray -->
  <line x1="12" y1="78" x2="84" y2="24" stroke="url(#skArrow)" stroke-width="2.5" stroke-linecap="round" filter="url(#skGlow)"/>
  <polygon points="88,21 78,24 81,30" fill="#ffffff" filter="url(#skGlow)"/>
</svg>
